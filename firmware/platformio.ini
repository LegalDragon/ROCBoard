; ROCBoard PlatformIO configuration
;
; Environments:
;   esp32-s3-devkitc-1  Phase 1: onboard RGB blink (GPIO48)
;   phase2_14leds       Phase 2: single 14-seg character (GPIO1, 14 LEDs)
;   phase3_full         Phase 3/4/5: full scoreboard + JSON serial (GPIO1, 336 LEDs)
;   native              Host unit tests (no hardware required)

; ─── Shared settings ─────────────────────────────────────────────────────────
[common]
arduino_lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.1.0
native_lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; ─── Phase 1: Single onboard LED blink ───────────────────────────────────────
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.arduino_lib_deps}
build_flags = -DHARDWARE_PROFILE=PROFILE_1_LED
monitor_speed = 115200

; ─── Phase 2: Single 14-segment character ────────────────────────────────────
[env:phase2_14leds]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.arduino_lib_deps}
build_flags = -DHARDWARE_PROFILE=PROFILE_14_LED
monitor_speed = 115200

; ─── Phase 3/4/5: Full scoreboard + JSON serial ───────────────────────────────
[env:phase3_full]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.arduino_lib_deps}
build_flags = -DHARDWARE_PROFILE=PROFILE_FULL_ID
monitor_speed = 115200

; ─── Native unit tests (host machine, no hardware) ────────────────────────────
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.native_lib_deps}
build_flags = -DNATIVE_TEST
