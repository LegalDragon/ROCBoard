; ROCBoard PlatformIO configuration

[env:esp32-s3-devkitc-1]
; Phase 1: Single WS2812B LED blink on ESP32-S3-DevKitC-1 (onboard RGB, GPIO48)
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = fastled/FastLED@^3.6.0
build_flags = -DLED_PIN=48 -DLED_COUNT=1 -DHARDWARE_PROFILE=PROFILE_1_LED
monitor_speed = 115200
test_framework = unity

[env:phase2_14leds]
; Phase 2: Single 14-segment character, GPIO1, 14 WS2812B LEDs
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = fastled/FastLED @ ^3.6.0
build_flags = -DHARDWARE_PROFILE=PROFILE_14_LED

[env:native]
platform = native
test_framework = unity
build_flags = -DNATIVE_TEST
