; ROCBoard PlatformIO configuration
; Phase 1: Single WS2812B LED blink on ESP32-S3-DevKitC-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = fastled/FastLED@^3.6.0
build_flags = -DLED_PIN=48 -DLED_COUNT=1
monitor_speed = 115200
test_framework = unity

[env:native]
platform = native
test_framework = unity
build_flags = -DNATIVE_TEST
